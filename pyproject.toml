[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowapp-reviews"
version = "1.0.0"
description = "Limpieza y análisis de reseñas de usuarios de FlowApp — EPAM Python Run, Reto 1"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ricardo Martinez B" }]
# Sin dependencias de runtime: solo librería estándar. Ver README § Decisiones.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
flowapp-reviews = "flowapp_reviews.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 90
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.coverage.run]
source = ["src/flowapp_reviews"]

[tool.ruff.lint.per-file-ignores]
# Los bloques de stopwords se escriben como texto y se parten con .split():
# una lista literal de 200 elementos sería ilegible y difícil de auditar.
"src/flowapp_reviews/text.py" = ["SIM905"]
# El signo × en la salida de consola es intencional (multiplicador de lift).
"src/flowapp_reviews/reporting.py" = ["RUF001"]
